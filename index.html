<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hand: Live</title>
<style>
:root{--bg:#121830;--ink:#f4efe6;--accent:#ffd166}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{padding:12px 16px;font-weight:800;font-size:22px}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
canvas,#preview{max-width:100%;max-height:100%}
#preview{display:none}
video#cam{display:none}
#msg{position:absolute;left:12px;right:12px;top:12px;font-size:14px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:12px}
#bar{display:flex;gap:10px;padding:14px 16px;justify-content:center;flex-wrap:wrap}
button,a.btn{border:0;border-radius:99px;padding:13px 20px;font:600 16px system-ui;background:#2b3563;color:#fff;text-decoration:none;cursor:pointer}
button.main{background:var(--accent);color:#1b2340}
button.rec{background:#e4572e;color:#fff}
button:disabled{opacity:.4}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<header>The Hand <span style="font-weight:500;opacity:.7;font-size:14px">Live</span></header>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="out"></canvas>
  <video id="preview" controls playsinline></video>
  <div id="msg">Tap Start camera. Point your phone at your hands.</div>
</div>
<div id="bar">
  <button class="main" id="start">Start camera</button>
  <button id="flip" disabled>Flip</button>
  <button id="rec" disabled>Record</button>
  <a class="btn" id="dl" style="display:none" download="the-hand-clip">Save clip</a>
  <button id="again" style="display:none">New clip</button>
</div>

<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
const $=id=>document.getElementById(id);
const cam=$("cam"),cv=$("out"),ctx=cv.getContext("2d"),msg=$("msg"),preview=$("preview");
let facing="environment",stream,lm,running=false,recorder,chunks=[],lastT=-1;

async function loadModel(){
  msg.textContent="Loading hand tracking (first time takes a few seconds)…";
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm=await HandLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numHands:2});
}
async function openCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:720},height:{ideal:1280}},audio:false});
  cam.srcObject=stream;await cam.play();
  cv.width=cam.videoWidth;cv.height=cam.videoHeight;
}
function frame(){
  if(!running)return;
  if(cam.readyState>=2&&cam.currentTime!==lastT){
    lastT=cam.currentTime;
    const mirror=facing==="user";
    ctx.save();
    if(mirror){ctx.translate(cv.width,0);ctx.scale(-1,1)}
    ctx.drawImage(cam,0,0,cv.width,cv.height);
    const r=lm.detectForVideo(cam,performance.now());
    ctx.lineWidth=4;ctx.strokeStyle="#ffd166";ctx.fillStyle="#fff";
    for(const hand of r.landmarks){
      for(const c of HandLandmarker.HAND_CONNECTIONS){
        const a=hand[c.start],b=hand[c.end];
        ctx.beginPath();ctx.moveTo(a.x*cv.width,a.y*cv.height);ctx.lineTo(b.x*cv.width,b.y*cv.height);ctx.stroke();
      }
      for(const p of hand){ctx.beginPath();ctx.arc(p.x*cv.width,p.y*cv.height,5,0,7);ctx.fill()}
    }
    ctx.restore();
    if(!recorder||recorder.state!=="recording")msg.textContent=r.landmarks.length?`${r.landmarks.length} hand${r.landmarks.length>1?"s":""} tracked`:"Show your hands to the camera";
  }
  requestAnimationFrame(frame);
}
$("start").onclick=async()=>{
  $("start").disabled=true;
  try{
    if(!lm)await loadModel();
    await openCam();
    running=true;$("flip").disabled=false;$("rec").disabled=false;$("start").style.display="none";
    frame();
  }catch(e){
    msg.textContent="Could not start: "+(e.message||e)+". Allow camera access and use the https link.";
    $("start").disabled=false;
  }
};
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";running=false;await openCam();running=true;frame()};
$("rec").onclick=()=>{
  if(recorder&&recorder.state==="recording"){recorder.stop();return}
  chunks=[];
  const types=["video/mp4","video/webm;codecs=vp9","video/webm"];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
  recorder=new MediaRecorder(cv.captureStream(30),mime?{mimeType:mime}:{});
  recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});
    const url=URL.createObjectURL(blob);
    preview.src=url;preview.style.display="block";cv.style.display="none";
    $("dl").href=url;$("dl").download="the-hand-clip."+(blob.type.includes("mp4")?"mp4":"webm");
    $("dl").style.display="";$("again").style.display="";
    $("rec").style.display="none";$("flip").style.display="none";
    running=false;msg.textContent="Clip ready. Save it or record a new one.";
  };
  recorder.start();$("rec").textContent="Stop";$("rec").classList.add("rec");msg.textContent="Recording…";
};
$("again").onclick=()=>{
  preview.style.display="none";cv.style.display="";
  $("dl").style.display="none";$("again").style.display="none";
  $("rec").style.display="";$("flip").style.display="";$("rec").textContent="Record";$("rec").classList.remove("rec");
  running=true;frame();
};
</script>
</body>
</html>
